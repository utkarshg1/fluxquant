# fluxquant GBM-GARCH simulation configuration
simulation:
  ticker: "AAPL"
  forecast_years: 5
  history_years: 3
  confidence_level: 0.95
  n_bootstrap: 10000
  var_level: 0.05

garch:
  mode: "optimize"
  max_p: 3
  max_q: 3
  # when mode=fixed:
  # p: 1
  # q: 1

output:
  save_dashboard: true
  dashboard_path: "./results/dashboard.html"
